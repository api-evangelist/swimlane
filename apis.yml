- aid: swimlane:swimlane-scim-api
  name: Swimlane SCIM API
  description: >-
    Swimlane provides a SCIM v2 API for user lifecycle management and provisioning on Business plans.
    The SCIM endpoint uses a separately generated bearer token for authentication and enables automated
    user provisioning and deprovisioning.
  humanURL: https://docs.swimlane.com/user-guide-10x/rest-api
  baseURL: https://{your-instance}.swimlane.app/api/scim/v2
