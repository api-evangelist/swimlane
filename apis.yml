- aid: swimlane:swimlane-turbine-api
  name: Swimlane Turbine API
  description: >-
    The Swimlane Turbine API provides access to the cloud-native Turbine platform, enabling integration
    with 500+ security tools and connectors. The Turbine API connector supports generic API requests to
    any Turbine instance with username/ password or personal access token authentication.
  humanURL: https://docs.swimlane.com/connectors/swimlane-turbine-api
  baseURL: https://{host}.swimlane.app/api
